name: build-linux-rpi

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET: linux
  TYPE: linux
  GCC: gcc10
  DISTRO: raspios
  CROSS_OS: bookworm
  NO_FORCE: 1
  USE_ARTIFACT: false
  # Prove the QEMU sysroot + GCC 10 cross compiler before brewing the full core set.
  FORMULAS_OVERRIDE: zlib
  GA_CI_SECRET: ${{ secrets.CI_SECRET }}

jobs:
  build-linux-rpi-aarch64:
    name: Raspberry Pi aarch64 - GCC10
    runs-on: ubuntu-22.04
    env:
      ARCH: aarch64
      LINUX_ARTIFACT_TARGET: linux_raspberrypi_arm64
      SYSROOT: /opt/rpi-arm64-sysroot
      TOOLCHAIN_ROOT: /usr
      TOOLCHAIN_PREFIX: aarch64-linux-gnu
      CC: aarch64-linux-gnu-gcc-10
      CXX: aarch64-linux-gnu-g++-10
      GCC_VERSION: "10"
      RPI_QEMU_ARCH: aarch64
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Linux artifact mapping
        run: bash scripts/linux/map_artifact_target.sh

      - name: Determine release identity
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            release=nightly
          else
            release=latest
          fi
          echo "RELEASE=$release" >> "$GITHUB_ENV"

      - name: Setup QEMU sysroot and GCC 10
        run: sudo --preserve-env=SYSROOT,TOOLCHAIN_ROOT,CROSS_OS,RPI_QEMU_ARCH,GITHUB_ENV ./scripts/linux/raspios/aarch64/setup.sh

      - name: Install target packages into sysroot
        run: sudo --preserve-env=SYSROOT,RPI_QEMU_ARCH ./scripts/linux/raspios/aarch64/install.sh

      - name: Build
        run: ./scripts/linux/raspios/aarch64/build.sh

      - name: Package canonical archive
        run: scripts/package.sh

      - name: List output
        run: |
          ls -lah out/ || true
          find out/ -type f \( -name "*.tar.bz2" -o -name "*.sha256" -o -name "*.json" \) -print || true

      - name: Update Release
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          draft: false
          files: |
            out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.ARCH }}_${{ env.GCC }}.tar.bz2
            out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.ARCH }}_${{ env.GCC }}.tar.bz2.sha256
            out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.ARCH }}_${{ env.GCC }}.tar.bz2.manifest.json

  # armv7l / armv6l: same GCC 10 + QEMU shape, after aarch64 is green.
