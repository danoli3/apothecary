name: build-linux

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Linux - ${{ matrix.arch }} - GCC10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/64
            artifact_target: linux_64
            arch: "64"
            runner: ubuntu-24.04
            arch_flags: -march=x86-64 -mtune=generic
          - target: linux/arm64
            artifact_target: linux_arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            arch_flags: -march=armv8-a -mtune=generic
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    env:
      TARGET: linux
      TYPE: linux
      ARCH: ${{ matrix.arch }}
      GCC: gcc10
      LINUX_ARTIFACT_TARGET: ${{ matrix.artifact_target }}
      NO_FORCE: 1
      USE_ARTIFACT: true
      CC: gcc-10
      CXX: g++-10
      CFLAGS: -O2 -fPIC ${{ matrix.arch_flags }}
      CXXFLAGS: -O2 -fPIC -D_GLIBCXX_USE_CXX11_ABI=1 ${{ matrix.arch_flags }}
    steps:
      - name: Install build tools and GCC 10
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y software-properties-common ca-certificates git sudo
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-10 g++-10 gfortran-10 binutils file curl unzip bzip2 autoconf automake build-essential ccache coreutils dos2unix flex gperf libtool make ninja-build pkg-config python3 python3-pip xz-utils freeglut3-dev libasound2-dev libc6-dev libegl1-mesa-dev libfftw3-dev libgl1-mesa-dev libglu1-mesa-dev libjack-dev libpulse-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev oss4-dev xorg-dev
          python3 -m pip install --no-cache-dir cmake==3.31.6
          cmake --version
          gcc-10 --version
          test "$(gcc-10 -dumpversion | cut -d. -f1)" = 10
      - uses: actions/checkout@v6.0.2
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Determine release identity
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            release=nightly
          else
            release=latest
          fi
          echo "RELEASE=$release" >> "$GITHUB_ENV"
      - name: Build libraries
        run: scripts/build.sh
      - name: Package canonical archive
        run: scripts/package.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_target }}-gcc10
          path: out/openFrameworksLibs_${{ env.RELEASE }}_${{ matrix.artifact_target }}_gcc10.tar.bz2*
      - name: Package modular archives
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        run: scripts/package-individual.sh
      - name: Upload modular workflow artifacts
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: actions/upload-artifact@v7
        with:
          name: modular-${{ matrix.artifact_target }}-gcc10
          path: out/oF_*_${{ matrix.artifact_target }}_gcc10.tar.bz2
          if-no-files-found: error
      - name: Upload release assets
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: softprops/action-gh-release@v2.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.ref == 'refs/heads/master' && 'nightly' || 'latest') }}
          files: |
            out/openFrameworksLibs_${{ env.RELEASE }}_${{ matrix.artifact_target }}_gcc10.tar.bz2
            out/openFrameworksLibs_${{ env.RELEASE }}_${{ matrix.artifact_target }}_gcc10.tar.bz2.sha256
            out/openFrameworksLibs_${{ env.RELEASE }}_${{ matrix.artifact_target }}_gcc10.tar.bz2.manifest.json

  upload-modular-release:
    name: Upload Linux modular archives
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: modular-*-gcc10
          path: modular
          merge-multiple: true
      - name: Upload assets to latest-modular
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest-modular modular/*.tar.bz2 --clobber --repo "$GITHUB_REPOSITORY"
