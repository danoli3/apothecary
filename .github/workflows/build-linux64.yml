name: build-linux

on:
  push:
    paths: &path-filter
      - '.github/workflows/build-linux64.yml'
      - '.github/workflows/detect-path-changes.yml'
      - '.github/path-filters.yml'
      - '.github/actions/**'
      - 'apothecary/apothecary'
      - 'apothecary/ostype.sh'
      - 'apothecary/toolchains/**'
      - 'apothecary/formulas/_depends/**'
      - 'scripts/build.sh'
      - 'scripts/package.sh'
      - 'scripts/package-individual.sh'
      - 'scripts/load.sh'
      - 'scripts/save.sh'
      - 'scripts/secure.sh'
      - 'scripts/downloader.sh'
      - 'scripts/format.sh'
      - 'scripts/calculate_formulas.sh'
      - 'scripts/artifact/**'
      - 'scripts/linux/**'
      - 'apothecary/formulas/glm/**'
      - 'apothecary/formulas/glm.sh'
      - 'apothecary/formulas/json/**'
      - 'apothecary/formulas/json.sh'
      - 'apothecary/formulas/utf8/**'
      - 'apothecary/formulas/utf8.sh'
      - 'apothecary/formulas/brotli/**'
      - 'apothecary/formulas/brotli.sh'
      - 'apothecary/formulas/zlib/**'
      - 'apothecary/formulas/zlib.sh'
      - 'apothecary/formulas/libpng/**'
      - 'apothecary/formulas/libpng.sh'
      - 'apothecary/formulas/glew/**'
      - 'apothecary/formulas/glew.sh'
      - 'apothecary/formulas/glfw/**'
      - 'apothecary/formulas/glfw.sh'
      - 'apothecary/formulas/freetype/**'
      - 'apothecary/formulas/freetype.sh'
      - 'apothecary/formulas/libxml2/**'
      - 'apothecary/formulas/libxml2.sh'
      - 'apothecary/formulas/svgtiny/**'
      - 'apothecary/formulas/svgtiny.sh'
      - 'apothecary/formulas/tess2/**'
      - 'apothecary/formulas/tess2.sh'
      - 'apothecary/formulas/kiss/**'
      - 'apothecary/formulas/kiss.sh'
      - 'apothecary/formulas/FreeImage/**'
      - 'apothecary/formulas/FreeImage.sh'
      - 'apothecary/formulas/fmt/**'
      - 'apothecary/formulas/fmt.sh'
      - 'apothecary/formulas/uriparser/**'
      - 'apothecary/formulas/uriparser.sh'
  pull_request:
    paths: *path-filter
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    uses: ./.github/workflows/detect-path-changes.yml

  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.linux-scripts == 'true' ||
      needs.changes.outputs.linux-formulas == 'true'
    needs: changes
    name: Linux - ${{ matrix.arch }} - GCC10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/64
            artifact_target: linux_64
            arch: "64"
            runner: ubuntu-24.04
            arch_flags: -march=x86-64 -mtune=generic
          - target: linux/arm64
            artifact_target: linux_arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            arch_flags: -march=armv8-a -mtune=generic
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    env:
      TARGET: linux
      TYPE: linux
      ARCH: ${{ matrix.arch }}
      GCC: gcc10
      LINUX_ARTIFACT_TARGET: ${{ matrix.artifact_target }}
      NO_FORCE: 1
      USE_ARTIFACT: true
      CC: gcc-10
      CXX: g++-10
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CFLAGS: -O2 -fPIC ${{ matrix.arch_flags }}
      CXXFLAGS: -O2 -fPIC -D_GLIBCXX_USE_CXX11_ABI=1 ${{ matrix.arch_flags }}
    steps:
      - name: Restore APT package cache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/apt/archives
          key: apt-focal-${{ matrix.arch }}-gcc10-v2

      - name: Install build tools and GCC 10
        shell: bash
        env:
          APT_ARCHIVES: /github/home/.cache/apt/archives
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt} failed; retrying in $((attempt * 5)) seconds: $*" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          install -d -m 755 "$APT_ARCHIVES/partial"
          retry apt-get update
          retry env DEBIAN_FRONTEND=noninteractive apt-get \
            -o "Dir::Cache::archives=$APT_ARCHIVES" \
            -o Acquire::Retries=5 \
            install -y --no-install-recommends \
            ca-certificates git sudo gcc-10 g++-10 binutils file curl unzip bzip2 \
            autoconf automake build-essential ccache coreutils flex gperf libtool \
            make ninja-build pkg-config python3 python3-pip xz-utils \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev wayland-protocols \
            libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxrandr-dev
          python3 -m pip install --no-cache-dir cmake==3.31.6
          cmake --version
          gcc-10 --version
          test "$(gcc-10 -dumpversion | cut -d. -f1)" = 10
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7.0.1
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: linux-${{ matrix.arch }}-gcc10
          max-size: 1G
      - name: Determine release identity
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            release=nightly
          else
            release=latest
          fi
          echo "RELEASE=$release" >> "$GITHUB_ENV"
      - name: Build libraries
        run: scripts/build.sh
      - name: Package canonical archive
        run: scripts/package.sh

      - name: List output directory
        run: ls -lah out/

      - name: List output main directory
        run: ls -lah

      - name: List packaged file
        run: find out/ -type f \( -name "*.zip" -o -name "*.tar.bz2" \) -exec echo {} \;

      - name: Generate Summary
        run: |
          chmod +x ./scripts/summary.sh
          ./scripts/summary.sh

      - name: Update Release
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          draft: false
          files: |
            out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.ARCH }}_${{ env.GCC }}.tar.bz2
            out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.ARCH }}_${{ env.GCC }}.tar.bz2.sha256
            out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.ARCH }}_${{ env.GCC }}.tar.bz2.manifest.json

      - name: Clean
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push'
        run: |
          rm -f out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.ARCH }}_${{ env.GCC }}.tar.bz2

      - name: Package Split
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' || contains(github.ref, 'refs/tags/'))
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package-individual.sh
        env:
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
          ARCH: ${{ env.ARCH }}

      - name: List output directory 3
        run: ls -lah out/

      - name: Clean before latest-modular upload
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && env.GCC == 'gcc10'
        run: |
          echo "Cleaning any existing openFrameworksLibs* files before latest-modular upload..."
          rm -f out/openFrameworksLibs*.tar.bz2

      - name: Upload to GitHub Release
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && env.GCC == 'gcc10'
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: "latest-modular"
          files: out/*.tar.bz2
