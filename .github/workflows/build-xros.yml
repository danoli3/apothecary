name: build-xros

on:
  push:
    paths: &path-filter
      - '.github/workflows/build-xros.yml'
      - '.github/workflows/detect-path-changes.yml'
      - '.github/path-filters.yml'
      - '.github/actions/**'
      - 'apothecary/apothecary'
      - 'apothecary/ostype.sh'
      - 'apothecary/toolchains/**'
      - 'apothecary/formulas/_depends/**'
      - 'scripts/build.sh'
      - 'scripts/package.sh'
      - 'scripts/package-individual.sh'
      - 'scripts/load.sh'
      - 'scripts/save.sh'
      - 'scripts/secure.sh'
      - 'scripts/downloader.sh'
      - 'scripts/format.sh'
      - 'scripts/calculate_formulas.sh'
      - 'scripts/artifact/**'
      - 'scripts/xros/**'
      - 'apothecary/formulas/pixman/**'
      - 'apothecary/formulas/pixman.sh'
      - 'apothecary/formulas/zlib/**'
      - 'apothecary/formulas/zlib.sh'
      - 'apothecary/formulas/utf8/**'
      - 'apothecary/formulas/utf8.sh'
      - 'apothecary/formulas/libpng/**'
      - 'apothecary/formulas/libpng.sh'
      - 'apothecary/formulas/brotli/**'
      - 'apothecary/formulas/brotli.sh'
      - 'apothecary/formulas/pugixml/**'
      - 'apothecary/formulas/pugixml.sh'
      - 'apothecary/formulas/freetype/**'
      - 'apothecary/formulas/freetype.sh'
      - 'apothecary/formulas/libxml2/**'
      - 'apothecary/formulas/libxml2.sh'
      - 'apothecary/formulas/svgtiny/**'
      - 'apothecary/formulas/svgtiny.sh'
      - 'apothecary/formulas/FreeImage/**'
      - 'apothecary/formulas/FreeImage.sh'
      - 'apothecary/formulas/assimp/**'
      - 'apothecary/formulas/assimp.sh'
      - 'apothecary/formulas/glew/**'
      - 'apothecary/formulas/glew.sh'
      - 'apothecary/formulas/videoInput/**'
      - 'apothecary/formulas/videoInput.sh'
      - 'apothecary/formulas/rtAudio/**'
      - 'apothecary/formulas/rtAudio.sh'
      - 'apothecary/formulas/tess2/**'
      - 'apothecary/formulas/tess2.sh'
      - 'apothecary/formulas/uriparser/**'
      - 'apothecary/formulas/uriparser.sh'
      - 'apothecary/formulas/cairo/**'
      - 'apothecary/formulas/cairo.sh'
      - 'apothecary/formulas/glm/**'
      - 'apothecary/formulas/glm.sh'
      - 'apothecary/formulas/json/**'
      - 'apothecary/formulas/json.sh'
      - 'apothecary/formulas/glfw/**'
      - 'apothecary/formulas/glfw.sh'
      - 'apothecary/formulas/opencv/**'
      - 'apothecary/formulas/opencv.sh'
      - 'apothecary/formulas/portaudio/**'
      - 'apothecary/formulas/portaudio.sh'
      - 'apothecary/formulas/libusb/**'
      - 'apothecary/formulas/libusb.sh'
      - 'apothecary/formulas/fmt/**'
      - 'apothecary/formulas/fmt.sh'
      - 'apothecary/formulas/openssl/**'
      - 'apothecary/formulas/openssl.sh'
      - 'apothecary/formulas/nghttp2/**'
      - 'apothecary/formulas/nghttp2.sh'
      - 'apothecary/formulas/nghttp3/**'
      - 'apothecary/formulas/nghttp3.sh'
      - 'apothecary/formulas/ngtcp2/**'
      - 'apothecary/formulas/ngtcp2.sh'
      - 'apothecary/formulas/libssh2/**'
      - 'apothecary/formulas/libssh2.sh'
      - 'apothecary/formulas/curl/**'
      - 'apothecary/formulas/curl.sh'
      - 'apothecary/formulas/poco/**'
      - 'apothecary/formulas/poco.sh'
      - 'apothecary/formulas/dawn/**'
      - 'apothecary/formulas/dawn.sh'
  pull_request:
    paths: *path-filter
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET: "xros"
  NO_FORCE: 1
  GA_CI_SECRET: ${{ secrets.CI_SECRET }}
  USE_ARTIFACT: true
  DISABLE_WORKFLOW: "false"

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.check-disabled.outputs.disabled }}
    steps:
    - name: Check if Workflow is disabled
      id: check-disabled
      shell: bash
      run: |
        if [ "${{ env.DISABLE_WORKFLOW }}" == "true" ]; then
          echo "disabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "disabled=false" >> "$GITHUB_OUTPUT"
        fi
  changes:
    uses: ./.github/workflows/detect-path-changes.yml

  build-xros-platforms:
    if: |
      needs.pre-check.outputs.workflow_disabled != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.engine == 'true' ||
       needs.changes.outputs.apple-scripts == 'true' ||
       (matrix.bundle == 1 && needs.changes.outputs.apple-bundle1 == 'true') ||
       (matrix.bundle == 2 && needs.changes.outputs.apple-bundle2 == 'true') ||
       (matrix.bundle == 3 && needs.changes.outputs.apple-bundle3 == 'true'))
    needs:
      - pre-check
      - changes
    runs-on: macos-26
    strategy:
      matrix:
        bundle: [1, 2, 3]
    env:
      TARGET: "xros"
      BUNDLE: ${{ matrix.bundle }}
      DEVELOPER_DIR: "/Applications/Xcode_26.6.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Determine Release
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "RELEASE=nightly" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/bleeding" ]]; then
            echo "RELEASE=latest" >> $GITHUB_ENV
          else
            echo "RELEASE=latest" >> $GITHUB_ENV
          fi
      - name: Scripts Calc Formula - ${{ env.TARGET }} Bundle ${{ matrix.bundle }}
        run: ./scripts/calculate_formulas.sh
      - name: Scripts Install
        run: ./scripts/xros/install.sh
      - name: Build VisionOS
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          TARGET: "xros"
          BUNDLE: ${{ matrix.bundle }}
          ARCH: arm64
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Build VisionOS
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          TARGET: "xros"
          BUNDLE: ${{ matrix.bundle }}
          ARCH: x86_64
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Build VisionOS SIMULATOR arm64
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          TARGET: "xros"
          BUNDLE: ${{ matrix.bundle }}
          ARCH: SIM_arm64
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Package Binaries for Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/artifact/artifact.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Upload binaries as Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: libs-xros-${{ env.TARGET }}-${{ matrix.bundle }}
          path: out/openFrameworksLibs_${{ env.release }}_${{ env.TARGET }}_${{ matrix.bundle }}.tar.bz2
          retention-days: 90
      - name: Remove .tar.bz2 files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        run: |
          echo "Removing .tar.bz2 files from out/ directory..."
          rm -f out/*.tar.bz2
          echo "Cleanup complete."
      - name: List output directory
        run: ls -lah out/
      - name: Merge our VisionOS libaries into XC Framework 
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/xros/xcframework_all.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Package XCFramework
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Update Release XCFramework
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          files: xout/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ matrix.bundle }}.tar.bz2
