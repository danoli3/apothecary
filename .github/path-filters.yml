# Shared path groups for workflow/bundle filters (dorny/paths-filter).
# Engine / toolchain / calculate_formulas changes run every bundle of a
# workflow that is triggered. Formula groups match scripts/calculate_formulas.sh.

engine:
  - 'apothecary/apothecary'
  - 'apothecary/ostype.sh'
  - 'apothecary/toolchains/**'
  - 'apothecary/formulas/_depends/**'
  - 'scripts/build.sh'
  - 'scripts/package.sh'
  - 'scripts/package-individual.sh'
  - 'scripts/calculate_formulas.sh'
  - 'scripts/artifact/**'
  - 'scripts/load.sh'
  - 'scripts/save.sh'
  - 'scripts/secure.sh'
  - 'scripts/downloader.sh'
  - 'scripts/format.sh'
  - '.github/actions/**'
  - '.github/path-filters.yml'
  - '.github/workflows/**'

apple-scripts:
  - 'scripts/osx/**'
  - 'scripts/macos/**'
  - 'scripts/ios/**'
  - 'scripts/tvOS/**'
  - 'scripts/tvos/**'
  - 'scripts/catos/**'
  - 'scripts/xros/**'
  - 'scripts/watchos/**'

vs-scripts:
  - 'scripts/vs/**'

msys2-scripts:
  - 'scripts/msys2/**'

linux-scripts:
  - 'scripts/linux/**'

android-scripts:
  - 'scripts/android/**'

emscripten-scripts:
  - 'scripts/emscripten/**'

